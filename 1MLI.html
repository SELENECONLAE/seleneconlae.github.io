        <figure>
            <img src="FOTO PARASIO/1ML/parasio_conventoschiara.jpeg" alt="Parasio Convento Santa Chiara" title="Parasio Convento Santa Chiara" >
            <figcaption>Il Monastero di Santa Chiara, composto da una chiesa e da un loggiato che la congiunge con l'antica cinta muraria della città, di cui oggi rimane il torrione.
            Si tratta di un edificio in stile barocco, affacciato sul Mar Ligure, che spicca per lo splendido risultato raggiunto nella fusione tra l'opera dell'uomo e la natura che la circonda.
            Fondato dalle Clarisse nel 1365, fu completamente rifatto nel Settecento insieme all'attigua Chiesa.
            <br>Si tratta di un monastero di stretta clausura, di cui si possono visitare solo la Chiesa e i parlatori. 
            Da qualche anno le monache clarisse ne hanno avviato, pur con enormi sacrifici, la ristrutturazione.</figcaption>
        </figure>
         <figure>
            <img src="FOTO PARASIO/1ML/parasio_duomo_interno.jpg" alt="Parasio Duomo interno" title="Parasio Duomo interno" >
            <figcaption>Iniziato nel 1781 e terminato nel 1838, il duomo di San Maurizio, chiesa più grande della Liguria, è stato progettato dall’architetto Gaetano Cantoni e rappresenta il monumento neoclassico ligure di maggior spicco.
                Nel 1947 è stato elevato a Basilica Minore e nel 1975 a Concattedrale. L’esterno è caratterizzato dalla facciata abbellita da colonne, semicolonne, lesene su due piani e da due imponenti campanili laterali.</figcaption>
        </figure>
         <figure>
            <img src="FOTO PARASIO/1ML/parasio_loggeschiara.jpg" alt="Parasio Logge Santa Chiara" title="Parasio Logge Santa Chiara" >
            <figcaption>Posizionate sul retro dell’omonimo convento ed affacciate sul mare sono state progettate dal pittore G. De Ferrari (1713) e dall’architetto G. Tortora. Come appoggio furono utilizzate le bastionate e il torrione delle antiche mura.
                Passeggiando sotto le logge è possibile godere di uno dei panorami più affascinanti della città.
                <br>Ogni estate, presso le logge di Santa Chiara, hanno luogo i “Concerti delle logge” che consistono in esibizioni di musicisti di grande rilevanza in una location unica nel suo genere.</figcaption>
        </figure>
